  .tab small { display:block; color:var(--dim); font-size:12px; margin-top:4px; }
  .tab.on { border-color:var(--hl); background:#1a2013; }
  .tab.on strong { color:var(--hl); }
  .phone { width:390px; background:var(--bg); border:1px solid #2a3330; border-radius:34px; padding:14px; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  .statusbar { display:flex; justify-content:space-between; font-size:11px; color:#6b7772; padding:2px 12px 10px; }
  .screen { background:var(--bg); border-radius:22px; padding:18px 16px 26px; max-height:78vh; overflow-y:auto; }
  .nav { text-align:center; font-size:15px; font-weight:600; padding:2px 0 14px; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; }
  .date { font-size:19px; font-weight:700; }
  .muted { color:var(--dim); font-size:12px; }
  .tiny { color:#6b7772; font-size:11px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; align-items:center; }
  .score-card { display:flex; gap:14px; align-items:center; }
  .score-num { font-size:40px; font-weight:800; line-height:1; }
  .score-level { font-size:12px; margin-top:3px; text-align:center; }
  .tone-ok{color:var(--ok)} .tone-amber{color:var(--amber)} .tone-red{color:var(--red)} .tone-info{color:var(--blue)}
  .headline { font-size:13px; line-height:1.55; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .cell { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 9px; }
  .cell-label { color:var(--dim); font-size:11px; }
  .cell-val { font-size:19px; font-weight:700; margin-top:2px; }
  .cell-unit { font-size:10px; color:var(--dim); font-weight:400; margin-left:3px; }
  .v-red{color:var(--red)} .v-amber{color:var(--amber)}
  .alert { border-left:4px solid var(--line); padding:9px 0 9px 10px; margin-top:9px; cursor:pointer; }
  .alert.red { border-color:var(--red); } .alert.amber { border-color:var(--amber); } .alert.info { border-color:#3a5a6b; }
  .alert-head { display:flex; gap:8px; align-items:center; }
  .badge { font-size:10px; padding:2px 7px; border-radius:5px; white-space:nowrap; }
  .badge.red { background:#3d1a1a; color:var(--red); } .badge.amber { background:#3a2c12; color:var(--amber); } .badge.info { background:#162630; color:var(--blue); }
  .alert-title { font-size:13px; font-weight:600; }
  .alert-body { font-size:12px; color:#b9c4be; line-height:1.6; margin-top:5px; }
  .kb { margin-top:7px; padding:7px 9px; background:#0f1211; border-radius:7px; display:none; }
  .kb.on { display:block; }
  .kb-line { font-size:11px; color:var(--dim); margin-top:3px; }
  .tip { padding:9px 0; border-bottom:1px solid #1f2523; }
  .tip:last-child { border-bottom:none; }
  .tip-title { font-size:12.5px; font-weight:600; color:var(--hl); }
  .tip-body { font-size:12px; color:#b9c4be; line-height:1.6; margin:4px 0; }
  .coach { font-size:11.5px; color:var(--dim); line-height:1.6; }
  .footnote { color:#5c6862; font-size:11px; margin-top:10px; line-height:1.6; }

let cur = 0;

function esc(s){ return String(s===undefined||s===null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderTabs(){
  document.getElementById('tabs').innerHTML = DATA.map((d,i)=>
    '<button class="tab '+(i===cur?'on':'')+'" onclick="pick('+i+')"><strong>'+esc(d.title)+'</strong><small>'+esc(d.note)+'</small></button>'
  ).join('');
}

function pick(i){ cur = i; renderTabs(); render(); }

function render(){
  const d = DATA[cur];

  const alerts = d.alerts.map((a,idx)=>`
    <div class="alert ${a.level}" onclick="document.getElementById('kb${idx}').classList.toggle('on')">
      <div class="alert-head">
        <span class="badge ${a.level==='red'?'red':(a.level==='amber'?'amber':'info')}">${a.level==='red'?'必须':(a.level==='amber'?'注意':'提示')}</span>
        <span class="alert-title">${esc(a.title)}</span>
      </div>
      <div class="alert-body">${esc(a.text)}</div>
      <div class="kb" id="kb${idx}">
        <div class="tiny">依据</div>
        ${a.kbTitles.filter(Boolean).map(t=>'<div class="kb-line">· '+esc(t)+'</div>').join('')}
      </div>
    </div>`).join('');

  const metrics = d.metrics.map(m=>`
    <div class="cell"><div class="cell-label">${esc(m.label)}</div>
    <div class="cell-val">${esc(m.value)}<span class="cell-unit">${esc(m.unit)}</span></div></div>`).join('');

  const tips = d.tips.map(t=>`
    <div class="tip"><div class="tip-title">${esc(t.title)}</div>
    <div class="tip-body">${esc(t.body)}</div><div class="tiny">${esc(t.source)}</div></div>`).join('');

  document.getElementById('screen').innerHTML = `
    <div class="nav">今日</div>
    <div class="top">
      <div><div class="date">${esc(d.date)} <span class="muted">周六</span></div>
      <div class="tiny">减脂期 · 距称重 35 天</div></div>
    </div>
    <div class="card score-card">
      <div style="min-width:74px;text-align:center">
        <div class="score-num tone-${tone}">${d.score}</div>
        <div class="score-level tone-${tone}">${esc(d.level)}</div>
      </div>
      <div class="headline">${esc(d.headline)}</div>
    </div>
    <div class="grid">${metrics}</div>
    <div class="card">
      <div class="row"><div style="font-size:14px;font-weight:600">今日要点</div><span class="muted">${d.alerts.length} 条</span></div>
      ${alerts}
    </div>
    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:4px">今天值得知道</div>
      ${tips}
    </div>
    <div class="card"><div class="coach"><b style="color:#8a968f">教练端会收到的摘要</b><br>${esc(d.coachSummary)}</div></div>
    <div class="footnote">静态预览 · 数据由 rules.js 真实计算</div>`;
}

renderTabs();
render();
</script>
</body>
</html>
